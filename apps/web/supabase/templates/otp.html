<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
<head>
  <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="only" />
  <title>Your sign-in code</title>
</head>
<body style="background-color:#fafafa;margin:auto;font-family:sans-serif;color:#242424;">

  <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
    style="max-width:37.5em;background-color:#fafafa;margin:auto;font-family:sans-serif;color:#242424;width:100%;">
    <tbody>
      <tr style="width:100%">
        <td>
          <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
            style="margin:auto;padding:40px 20px;max-width:480px;background-color:#fafafa;">
            <tbody>
              <tr style="width:100%">
                <td>

                  <!-- Logo -->
                  <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
                    style="margin-bottom:24px;">
                    <tbody>
                      <tr>
                        <td>
                          <img
                            src="https://vkxchopjqakvftcnxwie.supabase.co/storage/v1/object/public/assets/brand/ooruda-black-on-white.svg"
                            alt="Ooruda"
                            width="120"
                            style="display:block;border:0;outline:none;text-decoration:none;" />
                        </td>
                      </tr>
                    </tbody>
                  </table>

                  <!-- Card -->
                  <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
                    style="border-radius:0.75rem;background-color:rgb(255,255,255);padding:36px 48px;">
                    <tbody>
                      <tr>
                        <td>

                          <h1 style="margin:0 0 16px;padding:0;font-family:ui-sans-serif,system-ui,sans-serif;
                                     font-size:20px;font-weight:600;color:rgb(36,36,36);">
                            Your sign-in code
                          </h1>

                          <p style="color:rgb(36,36,36);font-size:15px;line-height:24px;margin:0 0 20px;">
                            Enter the code below to sign in to your Ooruda account:
                          </p>

                          <!-- OTP code box -->
                          <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0"
                            role="presentation"
                            style="text-align:center;background-color:rgb(243,244,246);
                                   padding:16px 4px;margin:0 0 24px;">
                            <tbody>
                              <tr>
                                <td>
                                  <p style="font-weight:700;font-size:30px;letter-spacing:6px;
                                            color:rgb(36,36,36);margin:0;">
                                    {{ .Token }}
                                  </p>
                                </td>
                              </tr>
                            </tbody>
                          </table>

                          <p style="color:rgb(107,114,128);font-size:12px;line-height:18px;margin:0;">
                            If you did not request this code, you can safely ignore this email.
                          </p>

                        </td>
                      </tr>
                    </tbody>
                  </table>

                  <!-- Footer -->
                  <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                    <tbody>
                      <tr>
                        <td>
                          <p style="font-size:12px;line-height:20px;color:rgb(209,213,219);
                                    padding:0 1rem;margin:16px 0;">
                            Ooruda — Property Management, simplified.
                          </p>
                        </td>
                      </tr>
                    </tbody>
                  </table>

                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>

</body>
</html>
