# A string used to distinguish different Supabase projects on the same host. Defaults to the working
# directory name when running `supabase init`.
project_id = "next-supabase-saas-kit-turbo"

[api]
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. public and storage are always included.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[studio]
# Port to use for Supabase Studio.
port = 54323

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
# Port to use for the email testing server web interface.
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://localhost:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/update-password",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 seconds (one
# week).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true
enable_manual_linking = true

# Phone / SMS auth — test numbers bypass the SMS hook and always accept OTP 123456.
# These match the seed_test_users.sh phone numbers (no '+' prefix).
[auth.sms]
enable_signup = true
enable_confirmations = true

# Twilio stub — only here to satisfy GoTrue's requirement for a provider so that
# GOTRUE_EXTERNAL_PHONE_ENABLED=true. Test OTP numbers bypass this entirely.
# The send_sms hook below overrides actual delivery for real numbers.
[auth.sms.twilio]
account_sid = "AClocal00000000000000000000000000"
auth_token = "local0000000000000000000000000000"
message_service_sid = "MGlocal0000000000000000000000000000"

[auth.sms.test_otp]
919911000001 = "123456"
919911000002 = "123456"
919911000003 = "123456"
919911000004 = "123456"
919911000005 = "123456"
919911000006 = "123456"

# Enable TOTP MFA
[auth.mfa.totp]
verify_enabled = true
enroll_enabled = true

[auth.email]
# Email is a SECONDARY login channel for users who already exist (provisioned
# by phone). It must never create new accounts, so email signups are disabled
# here (the app also passes shouldCreateUser:false). Phone signup is governed
# separately by the top-level [auth] enable_signup and is unaffected.
enable_signup = false
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
# MUST be false here: the add-email and change-email flows use a single OTP
# verification of the NEW address. Legacy phone-only users have no old email to
# confirm, and a user changing email may have lost access to the old one — both
# of which a double-confirm would dead-end. Only the new address is verified.
double_confirm_changes = false
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
secret = ""
# Overrides the default auth redirectUrl.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""

[auth.rate_limit]
email_sent = 1000

[auth.email.template.invite]
subject = "You are invited to Makerkit"
content_path = "./supabase/templates/invite-user.html"

[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirm-email.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.email_change]
subject = "Confirm your email change"
content_path = "./supabase/templates/change-email-address.html"

# Email OTP sign-in reuses GoTrue's magic_link template. We point it at the
# code template (otp.html contains {{ .Token }}) so users receive a 6-digit
# code, mirroring the phone OTP flow. Magic-link login itself is disabled
# (NEXT_PUBLIC_AUTH_MAGIC_LINK=false), so there is no link-login side effect.
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/otp.html"

# Wire the custom-sms-hook Edge Function as the GoTrue send_sms hook.
# This enables GOTRUE_EXTERNAL_PHONE_ENABLED so phone OTP sign-in works locally.
# For test_otp numbers GoTrue bypasses the hook entirely (no real SMS sent).
# For any real number it calls the function, which uses MOCK_OTP=true locally.
[auth.hook.send_sms]
enabled = true
uri = "http://127.0.0.1:54321/functions/v1/custom-sms-hook"
secrets = "v1,whsec_localdevsecret1234567890abcdef12345"

[analytics]
# Disabled for local dev: the vector container bind-mounts the Docker
# socket, which Colima's virtiofs cannot mount ("operation not supported").
# Re-enable when running under Docker Desktop if you need the log viewer.
enabled = false
port = 54327
backend = "postgres"

[functions.custom-sms-hook]
# Supabase Auth's "Send SMS" hook calls this function as a signed webhook, not
# as a user request — there's no Supabase JWT in the Authorization header.
# With verify_jwt left at its default (true), the Edge Functions gateway
# rejects every invocation with 401 before the function code ever runs,
# which GoTrue then surfaces to the client as a generic auth error. This is
# why real phone numbers fail to receive an OTP while dashboard test numbers
# (which never call the hook) work fine.
verify_jwt = false

[db.migrations]
schema_paths = ["./schemas/*.sql"]

[db.seed]
sql_paths = ['seed.sql', './seeds/*.sql']
